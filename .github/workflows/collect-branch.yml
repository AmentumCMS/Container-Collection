name: Collect All (Branch)
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      collectors: ${{ steps.set-matrix.outputs.collectors }}
      groups: ${{ steps.set-groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          # Use yq to grab the 'collectors' array and convert to compact JSON
          # We'll install yq if it's not on the runner
          JSON=$(yq -o=json -I=0 '.collectors' collectors.yaml)
          echo "collectors=$JSON" >> "$GITHUB_OUTPUT"

      - id: set-groups
        run: |
          # Keep your dynamic folder detection for bundling
          GROUPS=$(find collectors -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R . | jq -s -c .)
          echo "groups=$GROUPS" >> "$GITHUB_OUTPUT"

  collect:
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.collectors) }}
    uses: ./.github/workflows/collector-reusable.yml
    with:
      collector_name: ${{ matrix.name }}
      collector_yaml: ${{ matrix.yaml }}
      cred_profile: ${{ matrix.cred_profile || 'default' }}
      collect_helm: ${{ matrix.helm || false }}
      helm_repo_name: ${{ matrix.helm_repo_name }}
      helm_repo_url: ${{ matrix.helm_repo_url }}
      helm_chart: ${{ matrix.helm_chart }}
    secrets: inherit

  report:
    name: Combine Security Reports
    runs-on: ubuntu-24.04
    needs: [collect]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-scans
          pattern: "*-scan" # Grabs every artifact ending in -scan

      - name: Merge Reports
        run: |
          set -euo pipefail
          mkdir -p combined-reports/trivy
          mkdir -p combined-reports/grype
          
          # 1. Collect files from matrix artifacts
          find all-scans -path "*/trivy/*.json" -exec cp {} combined-reports/trivy/ \;
          find all-scans -path "*/grype/*.json" -exec cp {} combined-reports/grype/ \;
          
          # 2. Build text summary
          echo "GLOBAL TRIVY SECURITY SUMMARY" > combined-reports/trivy-summary-all.txt
          find all-scans -name "trivy-report.txt" -exec cat {} >> combined-reports/trivy-summary-all.txt \;

          # 3. Combine JSON (Removing the ** recursion since files are now flat)
          # Combine all individual JSON reports into a single JSON array
          jq -s '.' combined-reports/trivy/*.json > merged_results.json

      - name: Generate Consolidated Report
        run: |
          pip install jinja2
          # Merge all artifacts into a single array
          jq -s '.' combined-reports/trivy/*.json > merged_results.json
          python3 scripts/report_gen.py

      - name: Upload Combined Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Global-Security-Reports
          path: combined-reports/
  
  bundle-groups:
    name: Bundle ${{ matrix.group }} Group
    runs-on: ubuntu-24.04
    needs: [setup-matrix, collect]
    strategy:
      matrix:
        group: ${{ fromJson(needs.setup-matrix.outputs.groups) }}
    if: always()
    steps:
      - name: Install mkisofs
        run: sudo apt-get update && sudo apt-get install -y mkisofs

      - name: Download ALL artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: "${{ matrix.group }}-*" 

      - name: Organize and Build ISO
        run: |
          set -euo pipefail
          mkdir -p iso-root/helm
          mkdir -p iso-root/containers
          
          GROUP_TARGET="${{ matrix.group }}"
          echo "Filtering artifacts for group: $GROUP_TARGET"

          # Iterate through every downloaded artifact folder
          for artifact_dir in all-artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            
            DIR_NAME=$(basename "$artifact_dir")
            
            # Match if the artifact directory name starts with "GroupName-"
            if [[ "$DIR_NAME" == "$GROUP_TARGET-"* ]]; then
              echo "✅ Match found: $DIR_NAME"
              
              # 1. Copy container bundles (from mirror artifacts)
              # Use -not -path to avoid grabbing helm charts that might also be .tgz
              find "$artifact_dir" -type f -iname "*.tgz*" -not -path "*/helmchart/*" -exec cp -v {} iso-root/containers/ \;
              
              # 2. Copy Helm Evidence (from helm artifacts)
              find "$artifact_dir" -type f -iname "*.helm.sha" -exec cp -v {} iso-root/helm/ \;
              find "$artifact_dir" -ipath "*/helmchart/*.tgz" -exec cp -v {} iso-root/helm/ \;
            fi
          done

          # Check if we actually found anything
          if [ ! "$(ls -A iso-root/containers 2>/dev/null)" ] && [ ! "$(ls -A iso-root/helm 2>/dev/null)" ]; then
             echo "❌ No content found for group $GROUP_TARGET. Skipping ISO creation."
             exit 0
          fi

          # Build the ISO
          VOLUME_ID=$(echo "$GROUP_TARGET" | tr '[:lower:]' '[:upper:]' | cut -c 1-32)
          mkisofs -J -R -l -V "$VOLUME_ID" -o "${GROUP_TARGET}-Group.iso" iso-root
          sha256sum "${GROUP_TARGET}-Group.iso" > "${GROUP_TARGET}-Group.iso.sha"

      - name: Upload Group ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.group }}-Group-ISO
          path: ${{ matrix.group }}-Group.iso*