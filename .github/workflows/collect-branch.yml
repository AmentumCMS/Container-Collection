name: Collect All (Branch)

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kafka-ib
            yaml: collectors/Kafka-IB.yml
          - name: base
            yaml: collectors/Base.yml
          - name: pipeline
            yaml: collectors/Pipeline.yml

    uses: ./.github/workflows/collector-reusable.yml
    with:
      collector_name: ${{ matrix.name }}
      collector_yaml: ${{ matrix.yaml }}
    secrets: inherit
