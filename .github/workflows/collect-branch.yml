name: Collect All (Branch)
run-name: Collect containers

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  collect:
    name: Collect ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: argocd-ib
            yaml: collectors/ArgoCD-IB.yml
            helm: true
            helm_repo_name: argo
            helm_repo_url: https://argoproj.github.io/argo-helm
            helm_chart: argo-cd

          - name: ast-cli
            yaml: collectors/Ast-CLI.yml
            helm: false

          - name: bootc
            yaml: collectors/BootC.yml
            cred_profile: redhat
            helm: false

          - name: atlassian-bamboo-ib
            yaml: collectors/Atlassian/Bamboo-IB.yml
            helm: false

          - name: atlassian-bitbucket-ib
            yaml: collectors/Atlassian/Bitbucket-IB.yml
            helm: false

          - name: atlassian-confluence-ib
            yaml: collectors/Atlassian/Confluence-IB.yml
            helm: false

          - name: haproxy-ib
            yaml: collectors/HAProxy-IB.yml
            helm: true
            helm_repo_name: haproxytech
            helm_repo_url: https://haproxytech.github.io/helm-charts
            helm_chart: kubernetes-ingress

          - name: jdk-ib
            yaml: collectors/JDK-IB.yml
            helm: false

          - name: atlassian-jira-ib
            yaml: collectors/Atlassian/Jira-IB.yml
            helm: false

          - name: kafka-ib
            yaml: collectors/Kafka-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: kafka

          - name: kaniko-ib
            yaml: collectors/Kaniko-IB.yml
            helm: false

          - name: keycloak-ib
            yaml: collectors/Keycloak-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: keycloak

          - name: maven-ib
            yaml: collectors/Maven-IB.yml
            helm: false

          - name: nexus-ib
            yaml: collectors/Nexus-IB.yml
            helm: true
            helm_repo_name: sonatype
            helm_repo_url: https://sonatype.github.io/helm3-charts/
            helm_chart: nexus-repository-manager

          - name: nginx-ib
            yaml: collectors/Nginx-IB.yml
            helm: false

          - name: packer-ib
            yaml: collectors/Packer-IB.yml
            helm: false

          - name: postgres-ib
            yaml: collectors/PostgreSQL-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: postgresql

          - name: rabbitmq-ib
            yaml: collectors/RabbitMQ-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: rabbitmq

          - name: redis-ib
            yaml: collectors/Redis-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: redis

          - name: atlassian-search-ib
            yaml: collectors/Atlassian/Search-IB.yml
            helm: false

          - name: skopeo-ib
            yaml: collectors/Skopeo-IB.yml
            helm: false

          - name: sonarqube-cli
            yaml: collectors/Sonarqube-CLI.yml
            helm: false

          - name: atlassian-support-ib
            yaml: collectors/Atlassian/Support-IB.yml
            helm: false

          - name: ubi-ib
            yaml: collectors/UBI-IB.yml
            helm: false

    uses: ./.github/workflows/collector-reusable.yml
    with:
      collector_name: ${{ matrix.name }}
      collector_yaml: ${{ matrix.yaml }}
      cred_profile: ${{ matrix.cred_profile }}

      collect_helm: ${{ matrix.helm }}
      helm_repo_name: ${{ matrix.helm_repo_name }}
      helm_repo_url: ${{ matrix.helm_repo_url }}
      helm_chart: ${{ matrix.helm_chart }}
    secrets:
      # default creds (ex: registry1.dso.mil)
      default_user: ${{ secrets.REGISTRY_USER }}
      default_pass: ${{ secrets.REGISTRY_TOKEN }}

      # redhat creds
      redhat_user: ${{ secrets.REDHAT_USER }}
      redhat_pass: ${{ secrets.REDHAT_PASS }}
  report:
    name: Combine Security Reports
    runs-on: ubuntu-24.04
    needs: [collect]
    if: always()
    steps:
      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-scans
          pattern: "*-scan" # Grabs every artifact ending in -scan

      - name: Merge Reports
        run: |
          mkdir -p combined-reports/trivy
          mkdir -p combined-reports/grype
          
          # Find all trivy json files and move to combined folder
          find all-scans -path "*/trivy/*.json" -exec cp {} combined-reports/trivy/ \;
          
          # Find all grype json files and move to combined folder
          find all-scans -path "*/grype/*.json" -exec cp {} combined-reports/grype/ \;
          
          # Combine the human-readable trivy text reports into one big file
          echo "GLOBAL TRIVY SECURITY SUMMARY" > combined-reports/trivy-summary-all.txt
          find all-scans -name "trivy-report.txt" -exec cat {} >> combined-reports/trivy-summary-all.txt \;

          # 1. Combine all JSON files into one big array for the template
          # Trivy templates expect a list of Results
          jq -s '[.[].Results[]]' combined-reports/trivy/**/*.json > merged_results.json

          # 2. Render the HTML Overview
          trivy convert --format template \
            --template "@html.tpl" \
            -o "combined-reports/overview.html" merged_results.json

      - name: Upload Combined Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Global-Security-Reports
          path: combined-reports/