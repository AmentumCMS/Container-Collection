name: Collect All (Branch)
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  setup-matrix:
    name: Prepare Matrix & Groups
    runs-on: ubuntu-latest
    outputs:
      collectors: ${{ steps.data.outputs.collectors }}
      groups: ${{ steps.data.outputs.groups }}
    steps:
      - uses: actions/checkout@v4

      - id: data
        name: Load YAML and Extract Groups
        run: |
          set -euo pipefail

          # 1. Load the collectors matrix
          COLLECTORS_JSON=$(yq -o=json -I=0 '.collectors' collectors.yaml)
          echo "collectors=$COLLECTORS_JSON" >> "$GITHUB_OUTPUT"

          # 2. Extract unique groups from the yaml paths inside collectors.yaml
          # This pulls the folder name (e.g., Atlassian) from "collectors/Atlassian/Jira.yml"
          GROUPS_JSON=$(yq -o=json -I=0 '[.collectors[].yaml | split("/") | .[1]] | unique' collectors.yaml)
          echo "groups=$GROUPS_JSON" >> "$GITHUB_OUTPUT"
          
          # Debugging prints to the log
          echo "Matrix: $COLLECTORS_JSON"
          echo "Groups found in YAML: $GROUPS_JSON"

  collect:
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.collectors) }}
    uses: ./.github/workflows/collector-reusable.yml
    with:
      collector_name: ${{ matrix.name }}
      collector_yaml: ${{ matrix.yaml }}
      cred_profile: ${{ matrix.cred_profile || 'default' }}
      collect_helm: ${{ matrix.helm || false }}
      helm_repo_name: ${{ matrix.helm_repo_name }}
      helm_repo_url: ${{ matrix.helm_repo_url }}
      helm_chart: ${{ matrix.helm_chart }}
    secrets:
      default_user: ${{ secrets.REGISTRY_USER }}
      default_pass: ${{ secrets.REGISTRY_TOKEN }}
      redhat_user: ${{ secrets.REDHAT_USER }}
      redhat_pass: ${{ secrets.REDHAT_PASS }}

  report:
    name: Combine Security Reports
    runs-on: ubuntu-24.04
    needs: [collect]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-scans
          pattern: "*-scan" # Grabs every artifact ending in -scan

      - name: Merge Reports
        run: |
          set -euo pipefail
          mkdir -p combined-reports/trivy
          mkdir -p combined-reports/grype
          
          # 1. Collect files from matrix artifacts
          find all-scans -path "*/trivy/*.json" -exec cp {} combined-reports/trivy/ \;
          find all-scans -path "*/grype/*.json" -exec cp {} combined-reports/grype/ \;
          
          # 2. Build text summary
          echo "GLOBAL TRIVY SECURITY SUMMARY" > combined-reports/trivy-summary-all.txt
          find all-scans -name "trivy-report.txt" -exec cat {} >> combined-reports/trivy-summary-all.txt \;

          # 3. Combine JSON (Removing the ** recursion since files are now flat)
          # Combine all individual JSON reports into a single JSON array
          jq -s '.' combined-reports/trivy/*.json > merged_results.json

      - name: Generate Consolidated Report
        run: |
          pip install jinja2
          # Merge all artifacts into a single array
          jq -s '.' combined-reports/trivy/*.json > merged_results.json
          python3 scripts/report_gen.py

      - name: Upload Combined Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Global-Security-Reports
          path: combined-reports/
  
  bundle-groups:
    name: Bundle ${{ matrix.group }} Group
    runs-on: ubuntu-24.04
    needs: [setup-matrix, collect]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.setup-matrix.outputs.groups) }}
    steps:
      - name: Install mkisofs
        run: sudo apt-get update && sudo apt-get install -y mkisofs

      - name: Download group artifacts
        uses: actions/download-artifact@v4
        with:
          path: group-artifacts
          pattern: "${{ matrix.group }}-*"
          merge-multiple: true   # flattens the downloaded artifacts into one dir

      - name: Build ISO
        run: |
          set -euo pipefail
          mkdir -p iso-root/{helm,containers}

          # Containers (exclude helmchart tgz)
          find group-artifacts -type f \( -iname "*.tgz" -o -iname "*.tgz.*" \) \
            -not -path "*/helmchart/*" -exec cp -v {} iso-root/containers/ \;

          # Helm evidence
          find group-artifacts -type f -iname "*.helm.sha" -exec cp -v {} iso-root/helm/ \;
          find group-artifacts -type f -path "*/helmchart/*.tgz" -exec cp -v {} iso-root/helm/ \;

          if [ -z "$(find iso-root -type f -print -quit)" ]; then
            echo "❌ No content found for group ${{ matrix.group }}. Skipping."
            exit 0
          fi

          volume_id=$(echo "${{ matrix.group }}" | tr '[:lower:]' '[:upper:]' | cut -c 1-32)
          mkisofs -J -R -l -V "$volume_id" -o "${{ matrix.group }}-Group.iso" iso-root
          sha256sum "${{ matrix.group }}-Group.iso" > "${{ matrix.group }}-Group.iso.sha"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.group }}-Group-ISO
          path: ${{ matrix.group }}-Group.iso*