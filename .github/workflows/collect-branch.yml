name: Collect All (Branch)
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  setup-groups:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.set-groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      
      - id: set-groups
        shell: bash
        run: |
          echo "--- Processing Groups ---"
          shopt -s nullglob
          dirs=(collectors/*/)
          
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "groups=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build JSON array manually to avoid pipefail/jq issues
          JSON="["
          first=true
          for d in "${dirs[@]}"; do
            # Remove prefix and suffix
            name="${d#collectors/}"
            name="${name%/}"
            
            if [ "$first" = true ]; then
              JSON+="\"$name\""
              first=false
            else
              JSON+=",\"$name\""
            fi
          done
          JSON+="]"

          echo "groups=$JSON" >> "$GITHUB_OUTPUT"
          echo "Final JSON: $JSON"

  collect:
    name: Collect ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: argocd-ib
            yaml: collectors/Service/ArgoCD-IB.yml
            helm: true
            helm_repo_name: argo
            helm_repo_url: https://argoproj.github.io/argo-helm
            helm_chart: argo-cd

          - name: ast-cli
            yaml: collectors/Pipeline/Ast-CLI.yml
            helm: false

          - name: bootc
            yaml: collectors/Base/BootC.yml
            cred_profile: redhat
            helm: false

          - name: atlassian-bamboo-ib
            yaml: collectors/Atlassian/Bamboo-IB.yml
            helm: false

          - name: atlassian-bitbucket-ib
            yaml: collectors/Atlassian/Bitbucket-IB.yml
            helm: false

          - name: atlassian-confluence-ib
            yaml: collectors/Atlassian/Confluence-IB.yml
            helm: false

          - name: haproxy-ib
            yaml: collectors/Service/HAProxy-IB.yml
            helm: true
            helm_repo_name: haproxytech
            helm_repo_url: https://haproxytech.github.io/helm-charts
            helm_chart: kubernetes-ingress

          - name: jdk-ib
            yaml: collectors/Base/JDK-IB.yml
            helm: false

          - name: atlassian-jira-ib
            yaml: collectors/Atlassian/Jira-IB.yml
            helm: false

          - name: kafka-ib
            yaml: collectors/Service/Kafka-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: kafka

          - name: kaniko-ib
            yaml: collectors/Build/Kaniko-IB.yml
            helm: false

          - name: keycloak-ib
            yaml: collectors/Service/Keycloak-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: keycloak

          - name: maven-ib
            yaml: collectors/Build/Maven-IB.yml
            helm: false

          - name: nexus-ib
            yaml: collectors/Service/Nexus-IB.yml
            helm: true
            helm_repo_name: sonatype
            helm_repo_url: https://sonatype.github.io/helm3-charts/
            helm_chart: nexus-repository-manager

          - name: nginx-ib
            yaml: collectors/Base/Nginx-IB.yml
            helm: false

          - name: packer-ib
            yaml: collectors/Build/Packer-IB.yml
            helm: false

          - name: postgres-ib
            yaml: collectors/Service/PostgreSQL-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: postgresql

          - name: rabbitmq-ib
            yaml: collectors/Service/RabbitMQ-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: rabbitmq

          - name: redis-ib
            yaml: collectors/Service/Redis-IB.yml
            helm: true
            helm_repo_name: bitnami
            helm_repo_url: https://charts.bitnami.com/bitnami/
            helm_chart: redis

          - name: atlassian-search-ib
            yaml: collectors/Atlassian/Search-IB.yml
            helm: false

          - name: skopeo-ib
            yaml: collectors/Build/Skopeo-IB.yml
            helm: false

          - name: sonarqube-cli
            yaml: collectors/Pipeline/Sonarqube-CLI.yml
            helm: false

          - name: atlassian-support-ib
            yaml: collectors/Atlassian/Support-IB.yml
            helm: false

          - name: ubi-ib
            yaml: collectors/Base/UBI-IB.yml
            helm: false

    uses: ./.github/workflows/collector-reusable.yml
    with:
      collector_name: ${{ matrix.name }}
      collector_yaml: ${{ matrix.yaml }}
      cred_profile: ${{ matrix.cred_profile }}

      collect_helm: ${{ matrix.helm }}
      helm_repo_name: ${{ matrix.helm_repo_name }}
      helm_repo_url: ${{ matrix.helm_repo_url }}
      helm_chart: ${{ matrix.helm_chart }}
    secrets:
      # default creds (ex: registry1.dso.mil)
      default_user: ${{ secrets.REGISTRY_USER }}
      default_pass: ${{ secrets.REGISTRY_TOKEN }}

      # redhat creds
      redhat_user: ${{ secrets.REDHAT_USER }}
      redhat_pass: ${{ secrets.REDHAT_PASS }}
  report:
    name: Combine Security Reports
    runs-on: ubuntu-24.04
    needs: [collect]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-scans
          pattern: "*-scan" # Grabs every artifact ending in -scan

      - name: Merge Reports
        run: |
          set -euo pipefail
          mkdir -p combined-reports/trivy
          mkdir -p combined-reports/grype
          
          # 1. Collect files from matrix artifacts
          find all-scans -path "*/trivy/*.json" -exec cp {} combined-reports/trivy/ \;
          find all-scans -path "*/grype/*.json" -exec cp {} combined-reports/grype/ \;
          
          # 2. Build text summary
          echo "GLOBAL TRIVY SECURITY SUMMARY" > combined-reports/trivy-summary-all.txt
          find all-scans -name "trivy-report.txt" -exec cat {} >> combined-reports/trivy-summary-all.txt \;

          # 3. Combine JSON (Removing the ** recursion since files are now flat)
          # Combine all individual JSON reports into a single JSON array
          jq -s '.' combined-reports/trivy/*.json > merged_results.json

      - name: Generate Consolidated Report
        run: |
          pip install jinja2
          # Merge all artifacts into a single array
          jq -s '.' combined-reports/trivy/*.json > merged_results.json
          python3 scripts/report_gen.py

      - name: Upload Combined Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Global-Security-Reports
          path: combined-reports/
  
  bundle-groups:
    name: Bundle ${{ matrix.group }} Group
    runs-on: ubuntu-24.04
    needs: [setup-groups, collect]
    strategy:
      matrix:
        group: ${{ fromJson(needs.setup-groups.outputs.groups) }}
    if: always()
    steps:
      - name: Install mkisofs
        run: sudo apt-get update && sudo apt-get install -y mkisofs

      - name: Download ALL artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          # We grab all resolve and mirror artifacts
          pattern: "*-*" 

      - name: Organize and Build ISO
        run: |
          set -euo pipefail
          mkdir -p iso-root/helm
          mkdir -p iso-root/containers
          
          # Convert matrix group to lowercase for comparison
          echo "Filtering artifacts for group (normalized): ${{ matrix.group }}"

          # Iterate through every downloaded artifact folder
          for artifact_dir in all-artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            
            TAG_FILE="$artifact_dir/group_identity.txt"
            
            if [ -f "$TAG_FILE" ]; then
              IDENTITY=$(cat "$TAG_FILE")
              
              if [ "$IDENTITY" == "${{ matrix.group }}" ]; then
                echo "Adding $artifact_dir to ISO (Match: $IDENTITY)"
                
                # Use -iname for case-insensitive file finding
                # Copy container bundles
                find "$artifact_dir" -type f -iname "*.tgz*" -exec cp -v {} iso-root/containers/ \;
                
                # Copy Helm charts
                find "$artifact_dir" -type f -iname "*.helm.sha" -exec cp -v {} iso-root/helm/ \;
                # Match .tgz files inside a helmchart directory (case insensitive path)
                find "$artifact_dir" -ipath "*/helmchart/*.tgz" -exec cp -v {} iso-root/helm/ \;
              fi
            fi
          done

          # Check if we actually found anything for this group
          if [ ! "$(ls -A iso-root/containers 2>/dev/null)" ] && [ ! "$(ls -A iso-root/helm 2>/dev/null)" ]; then
             echo "No content found for group ${{ matrix.group }}. Skipping ISO creation."
             exit 0
          fi

          # Build the ISO
          # Volume ID: Uppercase is standard for ISOs, max 32 chars
          VOLUME_ID=$(echo "${{ matrix.group }}" | tr '[:lower:]' '[:upper:]' | cut -c 1-32)
          mkisofs -J -R -l -V "$VOLUME_ID" -o "${{ matrix.group }}-Group.iso" iso-root
          sha256sum "${{ matrix.group }}-Group.iso" > "${{ matrix.group }}-Group.iso.sha"

      - name: Upload Group ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.group }}-Group-ISO
          path: ${{ matrix.group }}-Group.iso*