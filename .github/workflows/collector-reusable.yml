name: Collector (Reusable)

on:
  workflow_call:
    inputs:
      collector_yaml:
        required: true
        type: string
      collector_name:
        required: true
        type: string

      cred_profile:
        required: false
        type: string
        default: default

      collect_helm:
        required: false
        type: boolean
        default: false
      helm_repo_name:
        required: false
        type: string
      helm_repo_url:
        required: false
        type: string
      helm_chart:
        required: false
        type: string

    secrets:
      default_user:
        required: false
      default_pass:
        required: false
      redhat_user:
        required: false
      redhat_pass:
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve image list
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.date.outputs.DATE }}
      group: ${{ steps.group-tag.outputs.GROUP_NAME }}
    env:
      COLLECTOR_YAML: ${{ inputs.collector_yaml }}
      COLLECTOR_NAME: ${{ inputs.collector_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Date stamp
        id: date
        run: echo "DATE=$(date '+%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Create Group Identity Tag
        id: group-tag
        run: |
          # Extracts 'Service' from 'collectors/Service/ArgoCD-IB.yml'
          GROUP_NAME=$(echo "${{ inputs.collector_yaml }}" | awk -F'/' '{print $2}')
          echo "$GROUP_NAME" > group_identity.txt
          echo "GROUP_NAME=$GROUP_NAME" >> "$GITHUB_OUTPUT"
          echo "Collector belongs to group: $GROUP_NAME"

      - name: Resolve images from YAML -> images.txt
        run: |
          set -euo pipefail
          : > images.txt

          registries="$(yq -r 'keys | .[]' "$COLLECTOR_YAML")"
          for reg in $registries; do
            yq -r ".\"$reg\".\"images-by-tag-regex\" // {} | to_entries[] | \"\(.key)\t\(.value)\"" "$COLLECTOR_YAML" \
            | while IFS=$'\t' read -r imgprefix regex; do
                imgprefix="${imgprefix%:}"
                tag="$(echo "$regex" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^\^//' -e 's/\$$//')"

                # exact-pin only
                if echo "$tag" | grep -Eq '[\^\$\[\]\(\)\|\*\+\?\\]'; then
                  echo "ERROR: Non-literal tag regex for $reg/$imgprefix => $regex"
                  exit 1
                fi

                echo "${reg}/${imgprefix}:${tag}" >> images.txt
              done
          done

          sort -u images.txt -o images.txt
          echo "Resolved images:"
          nl -ba images.txt

      - name: Save registry list (for logins)
        run: |
          set -euo pipefail

          yq -r 'keys | .[]' "$COLLECTOR_YAML" \
            | sort -u \
            | grep -vE '^(ghcr\.io)$' \
            | grep -vE '(^|\.)(docker\.io)$' \
            > registries.txt || true

          echo "Registries:"
          if [ -s registries.txt ]; then
            nl -ba registries.txt
          else
            echo "(none)"
          fi


      - name: Upload images + registries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ steps.date.outputs.DATE }}-resolve
          path: |
            images.txt
            registries.txt
          if-no-files-found: error

  scan:
    name: Compliance scan (Trivy + Grype)
    runs-on: ubuntu-24.04
    needs: [resolve]
    env:
      COLLECTOR_NAME: ${{ inputs.collector_name }}
      DATE: ${{ needs.resolve.outputs.date }}
      TRIVY_SEVERITY: "HIGH,CRITICAL"
      GRYPE_FAIL_ON: "high"
      CRED_PROFILE: ${{ inputs.cred_profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Download resolved inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-resolve
          path: .

      - name: Pick credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          case "${CRED_PROFILE}" in
            redhat)
              echo 'user=${{ secrets.redhat_user }}' >> "$GITHUB_OUTPUT"
              echo 'pass=${{ secrets.redhat_pass }}' >> "$GITHUB_OUTPUT"
              ;;
            default|*)
              echo 'user=${{ secrets.default_user }}' >> "$GITHUB_OUTPUT"
              echo 'pass=${{ secrets.default_pass }}' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install Trivy + Grype
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl

          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Docker login to registries from YAML (for scanning pulls)
        shell: bash
        run: |
          set -euo pipefail
          user='${{ steps.creds.outputs.user }}'
          pass='${{ steps.creds.outputs.pass }}'

          if [ -z "$user" ] || [ -z "$pass" ]; then
            echo "ERROR: missing credentials for profile '$CRED_PROFILE'"
            exit 1
          fi

          while read -r reg; do
            [ -n "$reg" ] || continue

            # skip non-FQDN-ish registry names
            if [[ "$reg" != *.* && "$reg" != *:* && "$reg" != "localhost" ]]; then
              echo "Skipping non-FQDN registry key: $reg"
              continue
            fi

            echo "Logging into docker registry: $reg"
            echo "$pass" | docker login "$reg" -u "$user" --password-stdin
          done < registries.txt

      - name: Trivy scan
        run: |
          set -euo pipefail
          mkdir -p scan-results/trivy
          mkdir -p scan-results/trivy-html
          : > scan-results/trivy-report.txt

          while read -r img; do
            [ -n "$img" ] || continue
            safe="$(printf '%s' "$img" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
            json_file="scan-results/trivy/${safe}.json"

            echo "=== Scanning $img ==="

            # 1. THE ONLY SCAN: Output to JSON
            trivy image --quiet --scanners vuln --severity "$TRIVY_SEVERITY" \
              --format json -o "$json_file" "$img" || true

            # 2. CONVERT TO TEXT (Appended for Cyber)
            echo "=== $img ===" >> scan-results/trivy-report.txt
            trivy convert --format template --template "@scripts/trivy.tpl" \
              "$json_file" >> scan-results/trivy-report.txt || true
            echo -e "\n" >> scan-results/trivy-report.txt

            # 3. CONVERT TO HTML (Individual file)
            trivy convert --format template --template "@scripts/html.tpl" \
              -o "scan-results/trivy-html/${safe}.html" "$json_file" || true

          done < images.txt

          # Gate remains the same
          if grep -Eq 'HIGH|CRITICAL' scan-results/trivy-report.txt; then
            echo "Compliance failed: HIGH/CRITICAL vulnerabilities found."
            # exit 1
          fi

      - name: Grype scan (gate)
        run: |
          set -euo pipefail
          mkdir -p scan-results/grype
          while read -r img; do
            [ -n "$img" ] || continue
            safe="$(printf '%s' "$img" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
            # --fail-on "$GRYPE_FAIL_ON"
            grype "$img" -o json > "scan-results/grype/${safe}.json"
          done < images.txt

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-scan
          path: scan-results/
          if-no-files-found: error

  helm:
    name: Collect Helm chart
    runs-on: ubuntu-24.04
    needs: [resolve]
    if: ${{ inputs.collect_helm }}
    env:
      COLLECTOR_NAME: ${{ inputs.collector_name }}
      DATE: ${{ needs.resolve.outputs.date }}
      HELM_REPO_NAME: ${{ inputs.helm_repo_name }}
      HELM_REPO_URL:  ${{ inputs.helm_repo_url }}
      HELM_CHART:     ${{ inputs.helm_chart }}
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sudo bash
          helm version

      - name: Grab helm
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${COLLECTOR_NAME}/helmchart"
          cd "${COLLECTOR_NAME}/helmchart"

          echo -e "\nSet repo and pull chart"
          helm repo add "${HELM_REPO_NAME}" "${HELM_REPO_URL}"
          helm repo update
          helm pull "${HELM_REPO_NAME}/${HELM_CHART}"

          echo -e "\nInstall helm images plugin"
          helm plugin install https://github.com/nikhilsbhat/helm-images > /dev/null 2>&1 || true

          echo -e "\nImages listed in chart"
          helm images get "${HELM_REPO_NAME}/${HELM_CHART}" || true

          echo -e "\n\nHelmchart Hash"
          # Avoid "Is a directory" by hashing only regular files
          find . -maxdepth 1 -type f -print0 | xargs -0 sha256sum -b | tee "../${COLLECTOR_NAME}-${DATE}.helm.sha"

          echo -e "\n\nList files:\n$(pwd; ls -1SSh)"

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.group }}-${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-helm
          path: |
            ${{ env.COLLECTOR_NAME }}/helmchart/**
            ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}.helm.sha
          if-no-files-found: error

  sync:
    name: Skopeo sync + package mirror
    runs-on: ubuntu-24.04
    needs: [resolve, scan]
    env:
      COLLECTOR_YAML: ${{ inputs.collector_yaml }}
      COLLECTOR_NAME: ${{ inputs.collector_name }}
      DATE: ${{ needs.resolve.outputs.date }}
      CRED_PROFILE: ${{ inputs.cred_profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Download resolved inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-resolve
          path: .

      - name: Download Helm chart (if enabled)
        if: ${{ inputs.collect_helm }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.group }}-${{ inputs.collector_name }}-${{ env.DATE }}-helm
          path: .

      - name: Pick credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          case "${CRED_PROFILE}" in
            redhat)
              echo "user=${{ secrets.redhat_user }}" >> "$GITHUB_OUTPUT"
              echo "pass=${{ secrets.redhat_pass }}" >> "$GITHUB_OUTPUT"
              ;;
            default|*)
              echo "user=${{ secrets.default_user }}" >> "$GITHUB_OUTPUT"
              echo "pass=${{ secrets.default_pass }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install skopeo + pigz
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y skopeo pigz

      - name: Skopeo login to registries from YAML
        shell: bash
        run: |
          set -euo pipefail
          user='${{ steps.creds.outputs.user }}'
          pass='${{ steps.creds.outputs.pass }}'

          if [ -z "$user" ] || [ -z "$pass" ]; then
            echo "ERROR: missing credentials for profile '$CRED_PROFILE'"
            exit 1
          fi

          while read -r reg; do
            [ -n "$reg" ] || continue

            # skip non-FQDN-ish registry names
            if [[ "$reg" != *.* && "$reg" != *:* && "$reg" != "localhost" ]]; then
              echo "Skipping non-FQDN registry key: $reg"
              continue
            fi

            echo "Skopeo login: $reg"
            skopeo login "$reg" -u "$user" -p "$pass"
          done < registries.txt

      - name: Skopeo sync (dir mirror)
        run: |
          set -euo pipefail
          skopeo sync --scoped --src yaml --dest dir \
            "$COLLECTOR_YAML" "${COLLECTOR_NAME}"

      - name: TAR mirror + hash
        run: |
          set -euo pipefail
          tar -cv -Ipigz \
            -f "${COLLECTOR_NAME}-${DATE}.tgz" "${COLLECTOR_NAME}" \
            | tee "${COLLECTOR_NAME}-${DATE}.tgz.txt"

          sha256sum -b "${COLLECTOR_NAME}-${DATE}.tgz" \
            | tee "${COLLECTOR_NAME}-${DATE}.tgz.sha"

      - name: Upload mirror tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.group }}-${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-mirror
          path: |
            ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}.tgz*
          if-no-files-found: error
