name: Collector (Reusable)

on:
  workflow_call:
    inputs:
      collector_yaml:
        required: true
        type: string
      collector_name:
        required: true
        type: string
      collect_helm:
        required: false
        type: boolean
        default: false
      helm_repo_name:
        required: false
        type: string
      helm_repo_url:
        required: false
        type: string
      helm_chart:
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve image list
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.date.outputs.DATE }}
    env:
      COLLECTOR_YAML: ${{ inputs.collector_yaml }}
      COLLECTOR_NAME: ${{ inputs.collector_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Date stamp
        id: date
        run: echo "DATE=$(date '+%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve images from YAML -> images.txt
        run: |
          set -euo pipefail
          : > images.txt

          registries="$(yq -r 'keys | .[]' "$COLLECTOR_YAML")"
          for reg in $registries; do
            yq -r ".\"$reg\".\"images-by-tag-regex\" // {} | to_entries[] | \"\(.key)\t\(.value)\"" "$COLLECTOR_YAML" \
            | while IFS=$'\t' read -r imgprefix regex; do
                imgprefix="${imgprefix%:}"
                tag="$(echo "$regex" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^\^//' -e 's/\$$//')"

                # exact-pin only
                if echo "$tag" | grep -Eq '[\^\$\[\]\(\)\|\*\+\?\\]'; then
                  echo "ERROR: Non-literal tag regex for $reg/$imgprefix => $regex"
                  exit 1
                fi

                echo "${reg}/${imgprefix}:${tag}" >> images.txt
              done
          done

          sort -u images.txt -o images.txt
          echo "Resolved images:"
          nl -ba images.txt
          test -s images.txt

      - name: Upload images.txt
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ steps.date.outputs.DATE }}-imagelist
          path: images.txt
          if-no-files-found: error

  scan:
    name: Compliance scan (Trivy + Grype)
    runs-on: ubuntu-24.04
    needs: [resolve]
    env:
      COLLECTOR_NAME: ${{ inputs.collector_name }}
      DATE: ${{ needs.resolve.outputs.date }}
      TRIVY_SEVERITY: "HIGH,CRITICAL"
      GRYPE_FAIL_ON: "high"
    steps:
      - uses: actions/checkout@v4

      - name: Download images.txt
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-imagelist
          path: .

      - name: Install Trivy + Grype
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y curl

          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Docker login (for scanning pulls)
        run: |
          set -euo pipefail
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ vars.REGISTRY }} \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Trivy scan (report + gate)
        run: |
          set -euo pipefail
          mkdir -p scan-results/trivy
          : > scan-results/trivy-report.txt

          while read -r img; do
            safe="$(echo "$img" | tr '/:@' '___')"
            echo "=== $img ===" | tee -a scan-results/trivy-report.txt

            trivy image --scanners vuln --severity "$TRIVY_SEVERITY" --format table "$img" \
              | tee -a scan-results/trivy-report.txt || true

            trivy image --scanners vuln --severity "$TRIVY_SEVERITY" --format json "$img" \
              > "scan-results/trivy/${safe}.json" || true

            echo "" >> scan-results/trivy-report.txt
          done < images.txt

          if grep -Eq 'HIGH|CRITICAL' scan-results/trivy-report.txt; then
            echo "Compliance failed: HIGH/CRITICAL vulnerabilities found."
            exit 1
          fi

      - name: Grype scan (gate)
        run: |
          set -euo pipefail
          mkdir -p scan-results/grype
          while read -r img; do
            safe="$(echo "$img" | tr '/:@' '___')"
            grype "$img" --fail-on "$GRYPE_FAIL_ON" -o json > "scan-results/grype/${safe}.json"
          done < images.txt

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-scan
          path: scan-results/
          if-no-files-found: error

  helm:
    name: Collect Helm chart
    runs-on: ubuntu-24.04
    needs: [resolve] # Should be after scan later, but I want to test
    if: ${{ inputs.collect_helm }}
    env:
      COLLECTOR_NAME: ${{ inputs.collector_name }}
      DATE: ${{ needs.resolve.outputs.date }}
      HELM_REPO_NAME: ${{ inputs.helm_repo_name }}
      HELM_REPO_URL:  ${{ inputs.helm_repo_url }}
      HELM_CHART:     ${{ inputs.helm_chart }}
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sudo bash
          helm version

      - name: Fetch chart + evidence
        run: |
          set -euo pipefail
          outdir="${COLLECTOR_NAME}/helmchart"
          mkdir -p "$outdir"
          cd "$outdir"

          helm repo add "$HELM_REPO_NAME" "$HELM_REPO_URL"
          helm repo update
          helm pull "$HELM_REPO_NAME/$HELM_CHART" --untar || helm pull "$HELM_REPO_NAME/$HELM_CHART"

          sha256sum -b * | tee "../${COLLECTOR_NAME}-${DATE}.helm.sha"
          ls -Alh

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-helm
          path: |
            ${{ env.COLLECTOR_NAME }}/helmchart/**
            ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}.helm.sha
          if-no-files-found: error

  sync:
    name: Skopeo sync + package mirror
    runs-on: ubuntu-24.04
    needs: [resolve, scan]
    env:
      COLLECTOR_YAML: ${{ inputs.collector_yaml }}
      COLLECTOR_NAME: ${{ inputs.collector_name }}
      DATE: ${{ needs.resolve.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Helm chart (if enabled)
        if: ${{ inputs.collect_helm }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.collector_name }}-${{ env.DATE }}-helm
          path: .

      - name: Install skopeo + pigz
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y skopeo pigz

      - name: Skopeo login
        run: |
          set -euo pipefail
          skopeo login ${{ vars.REGISTRY }} \
            -u ${{ secrets.REGISTRY_USER }} \
            -p ${{ secrets.REGISTRY_TOKEN }}

      - name: Skopeo sync (dir mirror)
        run: |
          set -euo pipefail
          skopeo sync --scoped --src yaml --dest dir \
            "$COLLECTOR_YAML" "${COLLECTOR_NAME}"

      - name: TAR mirror + hash
        run: |
          set -euo pipefail
          tar -cv -Ipigz \
            -f "${COLLECTOR_NAME}-${DATE}.tgz" "${COLLECTOR_NAME}" \
            | tee "${COLLECTOR_NAME}-${DATE}.tgz.txt"

          sha256sum -b "${COLLECTOR_NAME}-${DATE}.tgz" \
            | tee "${COLLECTOR_NAME}-${DATE}.tgz.sha"

      - name: Upload mirror tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-mirror
          path: |
            ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}.tgz*
          if-no-files-found: error

  iso:
    name: Build ISO
    runs-on: ubuntu-24.04
    needs: [resolve, sync]
    env:
      COLLECTOR_NAME: ${{ inputs.collector_name }}
      DATE: ${{ needs.resolve.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mkisofs + isomd5sum
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y mkisofs isomd5sum

      - name: Download mirror tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-mirror
          path: .

      - name: Make ISO + hash
        run: |
          set -euo pipefail
          mkdir -p iso-root
          cp "${COLLECTOR_NAME}-${DATE}.tgz"* iso-root/

          mkisofs -J -R -v -T -l \
            -V "${COLLECTOR_NAME}-${DATE}" \
            -A "${COLLECTOR_NAME}-${DATE}" \
            -o "${COLLECTOR_NAME}-${DATE}.iso" \
            iso-root

          implantisomd5 "${COLLECTOR_NAME}-${DATE}.iso"

          sha256sum -b "${COLLECTOR_NAME}-${DATE}.iso" \
            | tee "${COLLECTOR_NAME}-${DATE}.iso.sha"

      - name: Upload ISO bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}-iso
          path: |
            ${{ env.COLLECTOR_NAME }}-${{ env.DATE }}.iso*
          if-no-files-found: error
